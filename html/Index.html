<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Gestión Bibliotecaria</title>
    <link rel="stylesheet" href="../css/estilos.css">
    </head>
<body>
<nav class="menu-navegacion">
    <a href="#">Inicio</a>
    <a href="#">Libros</a>
    <a href="#">Buscar libros</a>
    <a href="#">Iniciar sesión</a>
</nav>
<main> 
    <section class="login-container">

    <header>

    <h1>Sistema de Gestión Bibliotecaria</h1>

    <p>Ingrese sus credenciales</p>
    </header>

    <div class="icono">
    <img src="../img/libro-candado.png" alt="Icono del sistema bibliotecario">
    </div>

    <form>
<label for="usuario">Usuario</label>
<input type="text" id="usuario" placeholder="Ingrese su usuario">
<label for="password">Contraseña</label>
<input type="password" id="password" placeholder="Ingrese su contraseña">
<nav>
    <a href="#">¿Olvidó su contraseña?</a>
    </nav>
<button type="button" onclick="iniciarSesion()">
    Iniciar sesión
</button>

</form>
</section>
</main>

<script src="../js/script.js"></script>

</body>
</html>
